project_id = "lex-active"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://127.0.0.1:5177/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true

[functions.delete-account]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/delete-account/index.ts"

[functions.private-media]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/private-media/index.ts"
