name: lex-active-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run npm run backend:local}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:54322:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:54324:8025"]
  auth:
    image: supabase/gotrue:v2.180.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_SITE_URL: http://127.0.0.1:5173
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:5173/**,http://localhost:5173/**,http://127.0.0.1:5177/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_DB_PASSWORD}@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@lex.local
      GOTRUE_SMTP_SENDER_NAME: LEX ACTIVE local test
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
    depends_on:
      db: {condition: service_healthy}
  rest:
    image: postgrest/postgrest:v13.0.4
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db: {condition: service_healthy}
  storage:
    image: supabase/storage-api:v1.28.2
    environment:
      ANON_KEY: ${LOCAL_ANON_KEY}
      SERVICE_KEY: ${LOCAL_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${LOCAL_DB_PASSWORD}@db:5432/postgres
      DATABASE_SEARCH_PATH: storage
      FILE_SIZE_LIMIT: 10485760
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: local
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes: ["objects:/var/lib/storage"]
    depends_on:
      db: {condition: service_healthy}
  gateway:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:54321:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 80;
          client_max_body_size 11m;
          proxy_hide_header Access-Control-Allow-Origin;
          proxy_hide_header Access-Control-Allow-Credentials;
          add_header Access-Control-Allow-Origin '*' always;
          add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
          add_header Access-Control-Allow-Headers 'authorization,apikey,x-client-info,content-type,prefer,range,x-upsert,x-supabase-api-version,cache-control,accept-profile,content-profile,x-supabase-client-platform,x-supabase-client-platform-version,x-supabase-client-runtime,x-supabase-client-runtime-version' always;
          if ($$request_method = OPTIONS) { return 204; }
          location /functions/v1/ { proxy_pass http://host.docker.internal:54325; }
          location /auth/v1/ { proxy_pass http://auth:9999/; }
          location /rest/v1/ { proxy_pass http://rest:3000/; }
          location /storage/v1/ { proxy_pass http://storage:5000/; }
        }
        NGINX
        exec nginx -g 'daemon off;'
    depends_on: [auth,rest,storage]
volumes:
  db:
  objects:
