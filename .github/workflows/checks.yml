name: Local backend and browser checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit
      - run: npx playwright install --with-deps chromium
      - run: npm run backend:local
      - run: npm run backend:migrate:local
      - name: Start local server function handlers
        run: |
          npm run backend:functions:local > /tmp/lex-functions.log 2>&1 &
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54325/functions/v1/delete-account || true)
            if [ "$status" = "405" ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm run test:backend
      - run: npm run test:cloud
      - name: Build actual device-only Pages-compatible artifact
        run: npm run build
        env:
          VITE_BASE_PATH: /lex-active/
      - run: npm run test:e2e
        env:
          TEST_PRODUCTION: "1"
          VITE_BASE_PATH: /lex-active/
      - name: Stop this job's local services
        if: always()
        run: docker compose --env-file supabase/.local.env -f supabase/local/compose.yml down
